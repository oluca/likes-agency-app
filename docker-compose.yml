services:
  app:
    image: ghcr.io/oluca/likes-agency-app:latest
    container_name: likes-agency-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.likes-agency-app.entrypoints=http"
      - "traefik.http.routers.likes-agency-app.rule=Host(`${DOMAIN:-app.likes.agency}`)"
      - "traefik.http.middlewares.likes-agency-app-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.likes-agency-app.middlewares=likes-agency-app-https-redirect"
      - "traefik.http.routers.likes-agency-app-secure.entrypoints=https"
      - "traefik.http.routers.likes-agency-app-secure.rule=Host(`${DOMAIN:-app.likes.agency}`)"
      - "traefik.http.routers.likes-agency-app-secure.tls=true"
      - "traefik.http.routers.likes-agency-app-secure.service=likes-agency-app"
      - "traefik.http.services.likes-agency-app.loadbalancer.server.port=3000"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      # Static files under /_next/static and /public go out uncompressed from Next.
      - "traefik.http.middlewares.likes-agency-app-compress.compress=true"
      # HTTPS-only via the redirect above; HSTS skips the http:// round trip on repeat visits.
      - "traefik.http.middlewares.likes-agency-app-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.likes-agency-app-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.likes-agency-app-headers.headers.forceSTSHeader=true"
      - "traefik.http.routers.likes-agency-app-secure.middlewares=likes-agency-app-compress,likes-agency-app-headers"

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
